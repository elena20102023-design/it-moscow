<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="790" viewBox="0 0 1660 790">
<rect x="0" y="0" width="1660" height="790" rx="0" fill="#F6F6EF" stroke="none"/>
<text x="45" y="54" fill="#4A36A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">ИССЛЕДОВАНИЕ АУДИТОРИИ</text>
<text x="45" y="118" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700">Путь студента IT.МОСКВА</text>
<rect x="45" y="156" width="1570" height="99" rx="14" fill="#E8E4FF" stroke="none"/>
<text x="64" y="188" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Маша, 17 лет · второй курс</text>
<text x="64" y="220" fill="#525B70" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Ищет конспект по сетям с телефона между парами. Если поиск не помогает, оставляет запрос. Гипотеза для проверки.</text>
<rect x="45" y="292" width="1570" height="68" rx="7" fill="#14182B" stroke="none"/>
<text x="65" y="319" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Этап</text>
<text x="210" y="319" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Действие</text>
<text x="445" y="319" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Точка контакта</text>
<text x="660" y="319" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Барьер</text>
<text x="903" y="319" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Решение</text>
<text x="1151" y="319" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Метрика</text>
<rect x="45" y="366" width="1570" height="68" rx="7" fill="#FFFFFF" stroke="none"/>
<text x="65" y="393" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Поиск</text>
<text x="210" y="393" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Вводит название или</text>
<text x="210" y="411" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">предмет</text>
<text x="445" y="393" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Строка поиска</text>
<text x="660" y="393" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Слишком много записей</text>
<text x="903" y="393" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Поиск по названию и</text>
<text x="903" y="411" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">предмету</text>
<text x="1151" y="393" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Время до результата</text>
<rect x="45" y="440" width="1570" height="68" rx="7" fill="#FFFFFF" stroke="none"/>
<text x="65" y="467" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Выбор</text>
<text x="210" y="467" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Фильтрует объявления</text>
<text x="445" y="467" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Фильтры и карточки</text>
<text x="660" y="467" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Запросы смешаны с</text>
<text x="660" y="485" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">предложениями</text>
<text x="903" y="467" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Вкладки типов и метки</text>
<text x="1151" y="467" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Доля открытых карточек</text>
<rect x="45" y="514" width="1570" height="68" rx="7" fill="#FFFFFF" stroke="none"/>
<text x="65" y="541" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Публикация</text>
<text x="210" y="541" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Оставляет запрос или</text>
<text x="210" y="559" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">предложение</text>
<text x="445" y="541" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Форма</text>
<text x="660" y="541" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Неясно, что написать</text>
<text x="903" y="541" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Короткие поля и примеры</text>
<text x="1151" y="541" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Доля завершённых публикаций</text>
<rect x="45" y="588" width="1570" height="68" rx="7" fill="#FFFFFF" stroke="none"/>
<text x="65" y="615" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Отклик</text>
<text x="210" y="615" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Отмечает интерес к</text>
<text x="210" y="633" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">материалу</text>
<text x="445" y="615" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Карточка</text>
<text x="660" y="615" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Неясно, сохранился ли</text>
<text x="660" y="633" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">отклик</text>
<text x="903" y="615" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Подтверждение на экране</text>
<text x="1151" y="615" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Доля карточек с откликом</text>
<rect x="45" y="662" width="1570" height="68" rx="7" fill="#FFFFFF" stroke="none"/>
<text x="65" y="689" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Завершение</text>
<text x="210" y="689" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Закрывает свою запись</text>
<text x="210" y="707" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">после обмена</text>
<text x="445" y="689" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Действие закрытия</text>
<text x="660" y="689" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Просроченные записи мешают</text>
<text x="660" y="707" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">поиску</text>
<text x="903" y="689" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Скрывать закрытые</text>
<text x="903" y="707" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">объявления</text>
<text x="1151" y="689" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Доля закрытых объявлений</text>
</svg>