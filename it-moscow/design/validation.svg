<text x="81" y="650" fill="#14182B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Сохранить сообщение</text>
<text x="69" y="708" fill="#525B70" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Учебное демо: сообщение не отправляется</text>
<text x="69" y="729" fill="#525B70" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">администрации.</text>
