<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>ПочтоКит — концепция и требования</title>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F4F3FA"/>
<text x="56" y="67.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5442AC">ПОЧТОКИТ  /  КОНЦЕПЦИЯ MVP</text>
<text x="56" y="125.0" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="700" fill="#202337">Сервис первой email-рассылки</text>
<text x="56" y="173.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#555D74">Для маркетологов небольших компаний, которые сами готовят письма и отчитываются о результатах.</text>
<rect x="56" y="223" width="550" height="572" rx="20" fill="#FFFFFF" stroke="#E4E2EE"/>
<text x="84" y="273.0" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#202337">Задача пользователя</text>
<text x="84" y="319.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#555D74">Алина хочет быстро подготовить письмо</text>
<text x="84" y="346.6" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#555D74">для действующих клиентов и показать</text>
<text x="84" y="374.2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#555D74">результат руководителю.</text>
<text x="84" y="445.0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#202337">Основные барьеры</text>
<text x="84" y="487" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#555D74">• Ошибки и дубли в списках</text>
<text x="84" y="523" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#555D74">• Долгая подготовка письма с нуля</text>
<text x="84" y="559" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#555D74">• Риск отправить письмо с ошибкой</text>
<rect x="84" y="660" width="494" height="106" rx="12" fill="#EAE6FB"/>
<text x="102" y="695.0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5442AC">Основной сценарий</text>
<text x="102" y="733.0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#5442AC">Контакты → Кампания → Проверка → Отчёт</text>
<rect x="630" y="223" width="754" height="572" rx="20" fill="#FFFFFF" stroke="#E4E2EE"/>
<text x="659" y="273.0" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#202337">Требования к MVP</text>
<text x="659" y="326.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#5442AC">01  Импорт контактов</text>
<text x="659" y="358" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">Принимать CSV и списки адресов. Показывать число</text>
<text x="659" y="383" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">принятых адресов, дублей и ошибок.</text>
<text x="659" y="434.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#5442AC">02  Редактор письма</text>
<text x="659" y="466" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">Дать готовый шаблон, поля темы и текста.</text>
<text x="659" y="491" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">Сохранять черновик в браузере.</text>
<text x="659" y="542.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#5442AC">03  Предпросмотр</text>
<text x="659" y="574" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">Показать письмо и получателей. Заблокировать запуск,</text>
<text x="659" y="599" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">если список, тема или текст пустые.</text>
<text x="659" y="650.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#5442AC">04  Отчёт</text>
<text x="659" y="682" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">После имитации отправки показать показатели</text>
<text x="659" y="707" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#555D74">и сохранить кампанию в истории.</text>
<text x="56" y="850.0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#555D74">Учебная версия использует тестовые контакты и демонстрационные показатели.</text>
</svg>