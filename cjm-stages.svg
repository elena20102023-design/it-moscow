<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Этапы работы над Customer Journey Map</title><rect width="1600" height="900" fill="#F4F3F8"/>
<text x="72" y="64" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#7B7690">
<tspan x="72" dy="0">CUSTOMER EXPERIENCE  /  CJM</tspan>
</text>
<text x="72" y="123" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600" fill="#242637">
<tspan x="72" dy="0">Этапы работы над</tspan>
</text>
<text x="72" y="174" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600" fill="#242637">
<tspan x="72" dy="0">Customer Journey Map</tspan>
</text>
<text x="72" y="219" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#7A788B">
<tspan x="72" dy="0">От исследования аудитории к улучшению клиентского опыта</tspan>
</text>
<rect x="1332" y="65" width="196" height="39" rx="20" fill="#E7E4F1"/>
<text x="1355" y="90" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#78698F">
<tspan x="1355" dy="0">ПРОЦЕСС  /  03 ЭТАПА</tspan>
</text>
<g id="Stage-01">
<rect x="72" y="276" width="464" height="486" rx="24" fill="#FFFFFF"/>
<rect x="96" y="300" width="416" height="92" rx="16" fill="#DCECF9"/>
<rect x="114" y="320" width="46" height="46" rx="13" fill="#C4DDF3"/>
<text x="125" y="349" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#3776AC">
<tspan x="125" dy="0">01</tspan>
</text>
<text x="177" y="349" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#245A87">
<tspan x="177" dy="0">Подготовка</tspan>
</text>
<text x="98" y="416" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#9391A3">
<tspan x="98" dy="0">Определяем задачу и рамки</tspan>
</text>
<circle cx="103" cy="474" r="3" fill="#5483B4"/>
<text x="121" y="480" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="121" dy="0">Определяем, зачем нам</tspan>
<tspan x="121" dy="28">нужна карта</tspan>
</text>
<circle cx="103" cy="552" r="3" fill="#5483B4"/>
<text x="121" y="558" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="121" dy="0">Оцениваем возможности</tspan>
<tspan x="121" dy="28">компании</tspan>
</text>
<circle cx="103" cy="630" r="3" fill="#5483B4"/>
<text x="121" y="636" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="121" dy="0">Ограничиваем рамки</tspan>
<tspan x="121" dy="28">проекта</tspan>
</text>
</g>
<g id="Stage-02">
<rect x="568" y="276" width="464" height="486" rx="24" fill="#FFFFFF"/>
<rect x="592" y="300" width="416" height="92" rx="16" fill="#DCECF9"/>
<rect x="610" y="320" width="46" height="46" rx="13" fill="#C4DDF3"/>
<text x="621" y="349" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#3776AC">
<tspan x="621" dy="0">02</tspan>
</text>
<text x="673" y="349" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#245A87">
<tspan x="673" dy="0">Создание</tspan>
</text>
<text x="594" y="416" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#9391A3">
<tspan x="594" dy="0">Исследуем путь клиента</tspan>
</text>
<circle cx="599" cy="474" r="3" fill="#5483B4"/>
<text x="617" y="480" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="617" dy="0">Собираем информацию</tspan>
<tspan x="617" dy="28">об аудитории</tspan>
</text>
<circle cx="599" cy="552" r="3" fill="#5483B4"/>
<text x="617" y="558" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="617" dy="0">Строим идеальный путь</tspan>
<tspan x="617" dy="28">клиента</tspan>
</text>
<circle cx="599" cy="630" r="3" fill="#5483B4"/>
<text x="617" y="636" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="617" dy="0">Определяем точки контакта</tspan>
<tspan x="617" dy="28">с компанией</tspan>
</text>
<circle cx="599" cy="708" r="3" fill="#5483B4"/>
<text x="617" y="714" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="617" dy="0">Фиксируем проблемы,</tspan>
<tspan x="617" dy="28">с которыми сталкивается клиент</tspan>
</text>
</g>
<g id="Stage-03">
<rect x="1064" y="276" width="464" height="486" rx="24" fill="#FFFFFF"/>
<rect x="1088" y="300" width="416" height="92" rx="16" fill="#DCECF9"/>
<rect x="1106" y="320" width="46" height="46" rx="13" fill="#C4DDF3"/>
<text x="1117" y="349" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#3776AC">
<tspan x="1117" dy="0">03</tspan>
</text>
<text x="1169" y="349" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#245A87">
<tspan x="1169" dy="0">Применение</tspan>
</text>
<text x="1090" y="416" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#9391A3">
<tspan x="1090" dy="0">Превращаем выводы в действия</tspan>
</text>
<circle cx="1095" cy="474" r="3" fill="#5483B4"/>
<text x="1113" y="480" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="1113" dy="0">Меняем стратегию</tspan>
<tspan x="1113" dy="28">и продукт на основе карты</tspan>
</text>
<circle cx="1095" cy="552" r="3" fill="#5483B4"/>
<text x="1113" y="558" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="1113" dy="0">Обновляем и дополняем</tspan>
<tspan x="1113" dy="28">карту</tspan>
</text>
<circle cx="1095" cy="630" r="3" fill="#5483B4"/>
<text x="1113" y="636" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6073">
<tspan x="1113" dy="0">Отслеживаем KPI</tspan>
</text>
</g>
<g id="Arrow-544" stroke="#6C91B6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M526 346h36m-8-8 8 8-8 8"/></g>
<g id="Arrow-1040" stroke="#6C91B6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1022 346h36m-8-8 8 8-8 8"/></g>
<text x="72" y="824" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#827A94">
<tspan x="72" dy="0">CJM помогает увидеть опыт клиента целиком и найти точки для улучшения.</tspan>
</text>
<text x="72" y="866" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#A09BAC">
<tspan x="72" dy="0">КАРТА КЛИЕНТСКОГО ПУТИ</tspan>
</text>
<text x="1455" y="866" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A09BAC">
<tspan x="1455" dy="0">02 / 02</tspan>
</text>
</svg>